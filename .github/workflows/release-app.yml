name: Native App Release Candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Select this same immutable tag in the workflow ref picker
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Bind manual release to the reviewed tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ inputs.release_tag }}
    outputs:
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Verify immutable tag, main CI, and draft CLI release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$TAG_NAME" == "$GITHUB_REF_NAME" ]]
          [[ "$GITHUB_REF" == "refs/tags/$TAG_NAME" ]]
          [[ "$TAG_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-alpha\.[1-9][0-9]*$ ]]
          [[ "$TAG_NAME" != "v0.3.0-alpha.1" ]]

          tag_object_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" --jq .object.type)
          tag_object_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" --jq .object.sha)
          [[ "$tag_object_type" == "tag" ]]
          tag_target_type=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" --jq .object.type)
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" --jq .object.sha)
          main_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$tag_target_type" == "commit" ]]
          [[ "$tag_commit" == "$GITHUB_SHA" ]]
          [[ "$tag_commit" == "$main_commit" ]]

          successful_ci_runs=$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$tag_commit&event=push&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.head_branch == "main" and .conclusion == "success")] | length'
          )
          [[ "$successful_ci_runs" -ge 1 ]]

          successful_cli_releases=$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?head_sha=$tag_commit&event=push&status=completed&per_page=100" \
              --jq '[.workflow_runs[] | select(.conclusion == "success")] | length'
          )
          [[ "$successful_cli_releases" -ge 1 ]]

          version=${TAG_NAME#v}
          release_state=$(
            gh release view "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,tagName \
              --jq '[.isDraft, .isPrerelease, .tagName] | @tsv'
          )
          [[ "$release_state" == $'true\ttrue\t'"$TAG_NAME" ]]

          cli_archive="devsift-$version-macos-universal.tar.gz"
          app_archive="DevSift-$version-macos-universal.zip"
          app_checksum="$app_archive.sha256"
          actual_assets=$(
            gh release view "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' \
              | LC_ALL=C sort
          )
          while IFS= read -r asset_name; do
            [[ -z "$asset_name" ]] && continue
            case "$asset_name" in
              "$cli_archive" | SHA256SUMS | "$app_archive" | "$app_checksum") ;;
              *) exit 1 ;;
            esac
          done <<< "$actual_assets"
          [[ "$(printf '%s\n' "$actual_assets" | grep -Fxc "$cli_archive")" -eq 1 ]]
          [[ "$(printf '%s\n' "$actual_assets" | grep -Fxc SHA256SUMS)" -eq 1 ]]

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  validate:
    name: Re-run app safety and packaging gates
    needs: gate
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      TAG_NAME: ${{ inputs.release_tag }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ inputs.release_tag }}

      - name: Rebind checked-out source to main
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$TAG_NAME"
          [[ "$GITHUB_REF" == "$tag_ref" ]]
          [[ "$(git cat-file -t "$tag_ref")" == "tag" ]]
          tag_commit=$(git rev-parse "$tag_ref^{commit}")
          [[ "$tag_commit" == "$GITHUB_SHA" ]]
          [[ "$tag_commit" == "$(git rev-parse HEAD)" ]]
          git fetch --no-tags --force origin refs/heads/main:refs/remotes/origin/main
          [[ "$tag_commit" == "$(git rev-parse refs/remotes/origin/main)" ]]
          scripts/release/verify-metadata.sh "$TAG_NAME"

      - name: Verify pinned release toolchain
        run: scripts/release/verify-toolchain.sh

      - name: Validate release scripts and package manifest
        shell: bash
        run: |
          set -euo pipefail
          sh -n scripts/release/*.sh
          swift package describe

      - name: Lint Swift formatting
        run: swift format lint --recursive --strict Package.swift Sources Tests

      - name: Build debug targets
        run: swift build --build-tests

      - name: Run app transaction and synthetic filesystem tests
        run: swift test --parallel

      - name: Build release targets
        run: swift build --configuration release

      - name: Reproduce the ad-hoc app archive
        shell: bash
        run: |
          set -euo pipefail
          scripts/release/verify-app-reproducibility.sh \
            "$RUNNER_TEMP/devsift-adhoc-app"

      - name: Confirm validation left the tagged tree unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
          [[ -z "$(git status --porcelain=v1 --untracked-files=all)" ]]

  sign-notarize:
    name: Sign, notarize, and staple app
    needs:
      - gate
      - validate
    runs-on: macos-15
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      TAG_NAME: ${{ inputs.release_tag }}
      VERSION: ${{ needs.gate.outputs.version }}
      # Public publisher identity; configuration must not redefine the verifier's trust root.
      DEVSIFT_APPLE_TEAM_ID: VN6283SM8B
    outputs:
      archive_sha256: ${{ steps.handoff.outputs.archive_sha256 }}
      checksum_sha256: ${{ steps.handoff.outputs.checksum_sha256 }}
      team_id: ${{ steps.handoff.outputs.team_id }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          ref: ${{ inputs.release_tag }}

      - name: Rebind checked-out source and toolchain
        shell: bash
        run: |
          set -euo pipefail
          tag_ref="refs/tags/$TAG_NAME"
          [[ "$GITHUB_REF" == "$tag_ref" ]]
          [[ "$(git cat-file -t "$tag_ref")" == "tag" ]]
          tag_commit=$(git rev-parse "$tag_ref^{commit}")
          [[ "$tag_commit" == "$GITHUB_SHA" ]]
          [[ "$tag_commit" == "$(git rev-parse HEAD)" ]]
          git fetch --no-tags --force origin refs/heads/main:refs/remotes/origin/main
          [[ "$tag_commit" == "$(git rev-parse refs/remotes/origin/main)" ]]
          scripts/release/verify-metadata.sh "$TAG_NAME"
          scripts/release/verify-toolchain.sh

      - name: Validate signing and notarization credentials
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVSIFT_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVSIFT_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.DEVSIFT_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.DEVSIFT_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.DEVSIFT_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null
          [[ "$DEVSIFT_APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ -n "$CERTIFICATE_BASE64" ]]
          [[ -n "$CERTIFICATE_PASSWORD" ]]
          [[ -n "$NOTARY_KEY_BASE64" ]]
          [[ "$NOTARY_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$NOTARY_ISSUER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]

      - name: Import the Developer ID Application identity
        shell: bash
        env:
          CERTIFICATE_BASE64: ${{ secrets.DEVSIFT_DEVELOPER_ID_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVSIFT_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/devsift-signing.keychain-db"
          certificate="$RUNNER_TEMP/devsift-developer-id.p12"
          original_keychains="$RUNNER_TEMP/devsift-original-keychains.txt"
          keychain_password=$(openssl rand -base64 32)
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$certificate"

          security list-keychains -d user > "$original_keychains"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" \
            -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -t cert \
            -f pkcs12
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$keychain_password" \
            "$keychain"
          search_keychains=("$keychain")
          while IFS= read -r keychain_entry; do
            keychain_entry=${keychain_entry#"${keychain_entry%%[![:space:]]*}"}
            keychain_entry=${keychain_entry#\"}
            keychain_entry=${keychain_entry%\"}
            [[ -z "$keychain_entry" ]] || search_keychains+=("$keychain_entry")
          done < "$original_keychains"
          [[ "${#search_keychains[@]}" -gt 1 ]]
          security list-keychains -d user -s "${search_keychains[@]}"

          signing_identities=$(security find-identity -v -p codesigning "$keychain")
          identity_count=$(printf '%s\n' "$signing_identities" | grep -c '"Developer ID Application:' || true)
          [[ "$identity_count" -eq 1 ]]
          signing_hash=$(
            printf '%s\n' "$signing_identities" \
              | awk '/"Developer ID Application:/ { print $2 }'
          )
          signing_name=$(
            printf '%s\n' "$signing_identities" \
              | awk -F'"' '/"Developer ID Application:/ { print $2 }'
          )
          [[ "$signing_hash" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$signing_name" == "Developer ID Application:"*"($DEVSIFT_APPLE_TEAM_ID)" ]]
          printf 'DEVSIFT_APP_SIGNING_IDENTITY=%s\n' "$signing_hash" >> "$GITHUB_ENV"
          rm -f "$certificate"

      - name: Build and Developer ID sign the universal app
        shell: bash
        run: |
          set -euo pipefail
          scripts/release/package-app.sh "$RUNNER_TEMP/devsift-signed-app"
          scripts/release/verify-app-bundle.sh \
            signed \
            "$RUNNER_TEMP/devsift-signed-app/DevSift.app" \
            "$VERSION" \
            "$DEVSIFT_APPLE_TEAM_ID"

      - name: Remove the signing identity before notarization
        shell: bash
        run: |
          set -euo pipefail
          original_keychains_file="$RUNNER_TEMP/devsift-original-keychains.txt"
          original_keychains=()
          while IFS= read -r keychain_entry; do
            keychain_entry=${keychain_entry#"${keychain_entry%%[![:space:]]*}"}
            keychain_entry=${keychain_entry#\"}
            keychain_entry=${keychain_entry%\"}
            [[ -z "$keychain_entry" ]] || original_keychains+=("$keychain_entry")
          done < "$original_keychains_file"
          [[ "${#original_keychains[@]}" -gt 0 ]]
          security list-keychains -d user -s "${original_keychains[@]}"
          security delete-keychain "$RUNNER_TEMP/devsift-signing.keychain-db"

      - name: Submit to Apple and staple the accepted ticket
        shell: bash
        env:
          NOTARY_KEY_BASE64: ${{ secrets.DEVSIFT_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.DEVSIFT_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.DEVSIFT_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          notary_key="$RUNNER_TEMP/devsift-notary-key.p8"
          notarization_result="$RUNNER_TEMP/devsift-notarization.json"
          archive="$RUNNER_TEMP/devsift-signed-app/DevSift-$VERSION-macos-universal.zip"
          app="$RUNNER_TEMP/devsift-signed-app/DevSift.app"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$notary_key"

          if ! xcrun notarytool submit "$archive" \
            --key "$notary_key" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait \
            --output-format json > "$notarization_result"; then
            cat "$notarization_result" >&2
            exit 1
          fi
          submission_status=$(plutil -extract status raw -o - "$notarization_result")
          submission_id=$(plutil -extract id raw -o - "$notarization_result")
          if [[ "$submission_status" != "Accepted" ]]; then
            xcrun notarytool log "$submission_id" \
              --key "$notary_key" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" >&2 || true
            exit 1
          fi

          notarization_log="$RUNNER_TEMP/devsift-notarization-log.json"
          xcrun notarytool log "$submission_id" "$notarization_log" \
            --key "$notary_key" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID"
          issue_count=$(plutil -convert json -o - "$notarization_log" | jq '.issues | length')
          [[ "$issue_count" -eq 0 ]]

          xcrun stapler staple -v "$app"
          xcrun stapler validate -v "$app"

      - name: Verify the stapled release app
        shell: bash
        run: |
          set -euo pipefail
          scripts/release/verify-app-bundle.sh \
            release \
            "$RUNNER_TEMP/devsift-signed-app/DevSift.app" \
            "$VERSION" \
            "$DEVSIFT_APPLE_TEAM_ID"

      - name: Re-archive the stapled app and verify the handoff
        id: handoff
        shell: bash
        run: |
          set -euo pipefail
          final_directory="$RUNNER_TEMP/devsift-app-release-handoff"
          archive_name="DevSift-$VERSION-macos-universal.zip"
          scripts/release/archive-app.sh \
            "$RUNNER_TEMP/devsift-signed-app/DevSift.app" \
            "$final_directory" \
            "$VERSION"

          expected_entries=$(printf '%s\n' SHA256SUMS "$archive_name" | LC_ALL=C sort)
          actual_entries=$(find "$final_directory" -mindepth 1 -maxdepth 1 -exec basename {} \; | LC_ALL=C sort)
          [[ "$actual_entries" == "$expected_entries" ]]
          for file_name in SHA256SUMS "$archive_name"; do
            [[ -f "$final_directory/$file_name" && ! -L "$final_directory/$file_name" ]]
          done
          checksum_line=$(sed -n '1p' "$final_directory/SHA256SUMS")
          archive_sha256=${checksum_line%% *}
          [[ "$archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$checksum_line" == "$archive_sha256  $archive_name" ]]
          [[ "$(awk 'END { print NR }' "$final_directory/SHA256SUMS")" == "1" ]]
          (cd "$final_directory" && shasum -a 256 -c SHA256SUMS)

          extraction_directory="$RUNNER_TEMP/devsift-stapled-extract"
          mkdir "$extraction_directory"
          ditto -x -k "$final_directory/$archive_name" "$extraction_directory"
          scripts/release/verify-app-bundle.sh \
            release \
            "$extraction_directory/DevSift.app" \
            "$VERSION" \
            "$DEVSIFT_APPLE_TEAM_ID"

          checksum_sha256=$(shasum -a 256 "$final_directory/SHA256SUMS" | awk '{ print $1 }')
          [[ "$checksum_sha256" =~ ^[0-9a-f]{64}$ ]]
          printf 'archive_sha256=%s\n' "$archive_sha256" >> "$GITHUB_OUTPUT"
          printf 'checksum_sha256=%s\n' "$checksum_sha256" >> "$GITHUB_OUTPUT"
          printf 'team_id=%s\n' "$DEVSIFT_APPLE_TEAM_ID" >> "$GITHUB_OUTPUT"

      - name: Upload the signed app handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: devsift-app-release-handoff
          path: ${{ runner.temp }}/devsift-app-release-handoff
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Remove signing and notarization credentials
        if: always()
        shell: bash
        run: |
          set -u
          cleanup_status=0
          original_keychains_file="$RUNNER_TEMP/devsift-original-keychains.txt"
          rm -f \
            "$RUNNER_TEMP/devsift-developer-id.p12" \
            "$RUNNER_TEMP/devsift-notary-key.p8" \
            "$RUNNER_TEMP/devsift-notarization.json" \
            "$RUNNER_TEMP/devsift-notarization-log.json" \
            || cleanup_status=1
          if [[ -s "$original_keychains_file" ]]; then
            original_keychains=()
            while IFS= read -r keychain_entry; do
              keychain_entry=${keychain_entry#"${keychain_entry%%[![:space:]]*}"}
              keychain_entry=${keychain_entry#\"}
              keychain_entry=${keychain_entry%\"}
              [[ -z "$keychain_entry" ]] || original_keychains+=("$keychain_entry")
            done < "$original_keychains_file"
            if [[ "${#original_keychains[@]}" -gt 0 ]]; then
              security list-keychains -d user -s "${original_keychains[@]}" \
                || cleanup_status=1
            else
              cleanup_status=1
            fi
          fi
          if [[ -e "$RUNNER_TEMP/devsift-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/devsift-signing.keychain-db" \
              || cleanup_status=1
          fi
          rm -f "$original_keychains_file" || cleanup_status=1
          exit "$cleanup_status"

  native-smoke:
    name: Install and launch (${{ matrix.architecture }}, macOS ${{ matrix.macos }})
    needs:
      - gate
      - sign-notarize
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            architecture: arm64
            macos: "14"
          - runner: macos-15-intel
            architecture: x86_64
            macos: "15"
    env:
      TAG_NAME: ${{ inputs.release_tag }}
      VERSION: ${{ needs.gate.outputs.version }}
      EXPECTED_ARCHIVE_SHA256: ${{ needs.sign-notarize.outputs.archive_sha256 }}
      EXPECTED_CHECKSUM_SHA256: ${{ needs.sign-notarize.outputs.checksum_sha256 }}
      EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
      EXPECTED_MACOS: ${{ matrix.macos }}
      DEVSIFT_APPLE_TEAM_ID: ${{ needs.sign-notarize.outputs.team_id }}

    steps:
      - name: Check out the verifier from the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag }}

      - name: Download the signed app handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: devsift-app-release-handoff
          path: ${{ runner.temp }}/devsift-app-release-handoff

      - name: Verify, install, and launch the downloaded app
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG_NAME" != "v0.3.0-alpha.1" ]]
          [[ "$EXPECTED_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_CHECKSUM_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$DEVSIFT_APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$(uname -m)" == "$EXPECTED_ARCHITECTURE" ]]
          [[ "$(sw_vers -productVersion | cut -d. -f1)" == "$EXPECTED_MACOS" ]]

          handoff="$RUNNER_TEMP/devsift-app-release-handoff"
          archive_name="DevSift-$VERSION-macos-universal.zip"
          expected_entries=$(printf '%s\n' SHA256SUMS "$archive_name" | LC_ALL=C sort)
          actual_entries=$(find "$handoff" -mindepth 1 -maxdepth 1 -exec basename {} \; | LC_ALL=C sort)
          [[ "$actual_entries" == "$expected_entries" ]]
          actual_archive_sha256=$(shasum -a 256 "$handoff/$archive_name" | awk '{ print $1 }')
          actual_checksum_sha256=$(shasum -a 256 "$handoff/SHA256SUMS" | awk '{ print $1 }')
          [[ "$actual_archive_sha256" == "$EXPECTED_ARCHIVE_SHA256" ]]
          [[ "$actual_checksum_sha256" == "$EXPECTED_CHECKSUM_SHA256" ]]
          [[ "$(sed -n '1p' "$handoff/SHA256SUMS")" == "$EXPECTED_ARCHIVE_SHA256  $archive_name" ]]
          (cd "$handoff" && shasum -a 256 -c SHA256SUMS)

          install_directory="$RUNNER_TEMP/Applications"
          mkdir "$install_directory"
          ditto -x -k "$handoff/$archive_name" "$install_directory"
          app="$install_directory/DevSift.app"
          scripts/release/verify-app-bundle.sh \
            release \
            "$app" \
            "$VERSION" \
            "$DEVSIFT_APPLE_TEAM_ID"

          launched_pid=
          cleanup() {
            if [[ -n "${launched_pid:-}" ]]; then
              kill "$launched_pid" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT HUP INT TERM

          open -n "$app"
          for _ in {1..30}; do
            launched_pid=$(pgrep -x DevSift | sed -n '1p' || true)
            [[ -z "$launched_pid" ]] || break
            sleep 1
          done
          [[ -n "$launched_pid" ]]
          sleep 3
          kill -0 "$launched_pid"

  publish:
    name: Attest, verify, and publish the complete pre-release
    needs:
      - gate
      - sign-notarize
      - native-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ inputs.release_tag }}
      VERSION: ${{ needs.gate.outputs.version }}
      EXPECTED_ARCHIVE_SHA256: ${{ needs.sign-notarize.outputs.archive_sha256 }}
      EXPECTED_CHECKSUM_SHA256: ${{ needs.sign-notarize.outputs.checksum_sha256 }}

    steps:
      - name: Download the signed app handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: devsift-app-release-handoff
          path: ${{ runner.temp }}/devsift-app-release-handoff

      - name: Revalidate draft release and untrusted handoff
        id: handoff
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$TAG_NAME" == "$GITHUB_REF_NAME" ]]
          [[ "$GITHUB_REF" == "refs/tags/$TAG_NAME" ]]
          [[ "$TAG_NAME" != "v0.3.0-alpha.1" ]]
          [[ "$EXPECTED_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_CHECKSUM_SHA256" =~ ^[0-9a-f]{64}$ ]]

          tag_object_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" --jq .object.type)
          tag_object_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" --jq .object.sha)
          [[ "$tag_object_type" == "tag" ]]
          tag_target_type=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" --jq .object.type)
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" --jq .object.sha)
          main_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$tag_target_type" == "commit" ]]
          [[ "$tag_commit" == "$GITHUB_SHA" ]]
          [[ "$tag_commit" == "$main_commit" ]]

          release_state=$(
            gh release view "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,tagName \
              --jq '[.isDraft, .isPrerelease, .tagName] | @tsv'
          )
          [[ "$release_state" == $'true\ttrue\t'"$TAG_NAME" ]]

          handoff="$RUNNER_TEMP/devsift-app-release-handoff"
          archive_name="DevSift-$VERSION-macos-universal.zip"
          checksum_asset_name="$archive_name.sha256"
          expected_entries=$(printf '%s\n' SHA256SUMS "$archive_name" | LC_ALL=C sort)
          actual_entries=$(find "$handoff" -mindepth 1 -maxdepth 1 -exec basename {} \; | LC_ALL=C sort)
          [[ "$actual_entries" == "$expected_entries" ]]
          for file_name in SHA256SUMS "$archive_name"; do
            [[ -f "$handoff/$file_name" && ! -L "$handoff/$file_name" ]]
          done
          actual_archive_sha256=$(sha256sum "$handoff/$archive_name" | awk '{ print $1 }')
          actual_checksum_sha256=$(sha256sum "$handoff/SHA256SUMS" | awk '{ print $1 }')
          [[ "$actual_archive_sha256" == "$EXPECTED_ARCHIVE_SHA256" ]]
          [[ "$actual_checksum_sha256" == "$EXPECTED_CHECKSUM_SHA256" ]]
          [[ "$(sed -n '1p' "$handoff/SHA256SUMS")" == "$EXPECTED_ARCHIVE_SHA256  $archive_name" ]]
          [[ "$(awk 'END { print NR }' "$handoff/SHA256SUMS")" == "1" ]]
          (cd "$handoff" && sha256sum -c SHA256SUMS)

          cp "$handoff/SHA256SUMS" "$handoff/$checksum_asset_name"
          printf 'archive_path=%s\n' "$handoff/$archive_name" >> "$GITHUB_OUTPUT"
          printf 'checksum_path=%s\n' "$handoff/$checksum_asset_name" >> "$GITHUB_OUTPUT"

      - name: Attest exact signed and notarized app archive
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ steps.handoff.outputs.archive_path }}

      - name: Replace draft app assets and publish exact inventory
        shell: bash
        env:
          ARCHIVE_PATH: ${{ steps.handoff.outputs.archive_path }}
          CHECKSUM_PATH: ${{ steps.handoff.outputs.checksum_path }}
        run: |
          set -euo pipefail
          cli_archive_name="devsift-$VERSION-macos-universal.tar.gz"
          archive_name=$(basename "$ARCHIVE_PATH")
          checksum_name=$(basename "$CHECKSUM_PATH")
          remote_directory="$RUNNER_TEMP/devsift-complete-release-download"
          mkdir "$remote_directory"

          release_state=$(
            gh release view "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,tagName \
              --jq '[.isDraft, .isPrerelease, .tagName] | @tsv'
          )
          [[ "$release_state" == $'true\ttrue\t'"$TAG_NAME" ]]

          gh release upload "$TAG_NAME" \
            "$ARCHIVE_PATH" \
            "$CHECKSUM_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          actual_asset_names=$(
            gh release view "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' \
              | LC_ALL=C sort
          )
          expected_asset_names=$(printf '%s\n' \
            "$archive_name" \
            "$checksum_name" \
            SHA256SUMS \
            "$cli_archive_name" \
            | LC_ALL=C sort)
          [[ "$actual_asset_names" == "$expected_asset_names" ]]

          gh release download "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive_name" \
            --pattern "$checksum_name" \
            --pattern SHA256SUMS \
            --pattern "$cli_archive_name" \
            --dir "$remote_directory"
          cmp "$ARCHIVE_PATH" "$remote_directory/$archive_name"
          cmp "$CHECKSUM_PATH" "$remote_directory/$checksum_name"
          cli_archive_sha256=$(sha256sum "$remote_directory/$cli_archive_name" | awk '{ print $1 }')
          [[ "$cli_archive_sha256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$(sed -n '1p' "$remote_directory/SHA256SUMS")" == "$cli_archive_sha256  $cli_archive_name" ]]
          [[ "$(awk 'END { print NR }' "$remote_directory/SHA256SUMS")" == "1" ]]
          [[ "$(wc -l < "$remote_directory/SHA256SUMS" | tr -d '[:space:]')" == "1" ]]
          (cd "$remote_directory" && sha256sum -c SHA256SUMS)
          (cd "$remote_directory" && sha256sum -c "$checksum_name")
          [[ "$(sha256sum "$remote_directory/$archive_name" | awk '{ print $1 }')" == "$EXPECTED_ARCHIVE_SHA256" ]]
          [[ "$(sha256sum "$remote_directory/$checksum_name" | awk '{ print $1 }')" == "$EXPECTED_CHECKSUM_SHA256" ]]

          gh attestation verify \
            "$remote_directory/$cli_archive_name" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$TAG_NAME" \
            --deny-self-hosted-runners

          tag_object_type=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" --jq .object.type)
          tag_object_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG_NAME" --jq .object.sha)
          [[ "$tag_object_type" == "tag" ]]
          tag_target_type=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" --jq .object.type)
          tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha" --jq .object.sha)
          main_commit=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          [[ "$tag_target_type" == "commit" ]]
          [[ "$tag_commit" == "$GITHUB_SHA" ]]
          [[ "$tag_commit" == "$main_commit" ]]

          expected_notes="$RUNNER_TEMP/devsift-expected-release-notes.md"
          actual_notes="$RUNNER_TEMP/devsift-draft-release-notes.md"
          release_json="$RUNNER_TEMP/devsift-draft-release.json"
          gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/docs/releases/v$VERSION.md?ref=$TAG_NAME" \
            > "$expected_notes"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME" \
            > "$release_json"
          [[ "$(jq -r .name "$release_json")" == "DevSift $TAG_NAME" ]]
          jq -j .body "$release_json" > "$actual_notes"
          cmp "$expected_notes" "$actual_notes"

          gh release edit "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease \
            --latest=false
          published_state=$(
            gh release view "$TAG_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease,tagName \
              --jq '[.isDraft, .isPrerelease, .tagName] | @tsv'
          )
          [[ "$published_state" == $'false\ttrue\t'"$TAG_NAME" ]]
